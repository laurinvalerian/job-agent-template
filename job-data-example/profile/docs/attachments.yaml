# Beilagen-Register: id -> Datei (relativ zu profile/docs), Gruppe, Bezeichnung de/en.
# 'lebenslauf' muss existieren und ist immer die erste Beilage.
# Pro Gruppe geht bei Mail-Bewerbungen ein PDF mit (Dateiname file_de/file_en + _<file_prefix>.pdf).
# always: true = bei Mail-Bewerbungen immer alle Beilagen dieser Gruppe.
groups:
  zeugnis:
    de: Arbeitszeugnisse
    en: References
    file_de: Arbeitszeugnisse
    file_en: References
    always: true
  sparc:
    de: SPARC-Zertifikate
    en: SPARC certificates
    file_de: SPARC_Zertifikate
    file_en: SPARC_Certificates
    # always hier nicht, weil die Test-Daten die einzelnen Module enthalten
  microsoft:
    de: Microsoft-Zertifikate
    en: Microsoft certificates
    file_de: Microsoft_Zertifikate
    file_en: Microsoft_Certificates
    always: true
  hslu:
    de: Aufnahmebestätigung HSLU
    en: HSLU admission confirmation
    file_de: Aufnahmebestaetigung_HSLU
    file_en: HSLU_Admission
    compact: true   # im Brief nur der Titel
